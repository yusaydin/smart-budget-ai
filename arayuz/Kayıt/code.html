<body class="min-h-screen flex items-center justify-center p-container-padding font-body-md text-on-surface antialiased selection:bg-secondary-container selection:text-on-secondary-container">

<!-- Form Card (Glassmorphism) -->

<form action="#" class="flex flex-col gap-stack-gap-md" method="POST">

<input class="w-full h-12 pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors outline-none" id="fullname" name="fullname" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- E-posta Input -->
<div class="flex flex-col gap-stack-gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">E-posta</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant text-[20px]">mail</span>
<input class="w-full h-12 pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors outline-none" id="email" name="email" placeholder="ornek@email.com" required="" type="email"/>
</div>
</div>
<!-- Şifre Input -->
<div class="flex flex-col gap-stack-gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Şifre</label>

<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>

<script>
        // Simple password toggle logic
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtns = document.querySelectorAll('button[aria-label="Toggle password visibility"]');
            
            toggleBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const input = this.parentElement.querySelector('input');
                    const icon = this.querySelector('.material-symbols-outlined');
                    
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.textContent = 'visibility';
                        icon.classList.add('text-secondary');
                    } else {
                        input.type = 'password';
                        icon.textContent = 'visibility_off';
                        icon.classList.remove('text-secondary');
                    }
                });
            });
        });
    </script>
