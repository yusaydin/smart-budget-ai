<!-- Pre-auth screen: No Navigation Bars -->

</div>

</div>
</div>
<!-- Password Input -->
<div class="relative">
<div class="flex justify-between items-center mb-1 ml-1">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Şifre</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-secondary-container transition-colors" href="#">Şifremi Unuttum</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-xl">lock</span>
</div>
<input class="block w-full pl-11 pr-12 py-3 bg-surface border border-outline-variant rounded-xl text-on-surface focus:ring-2 focus:ring-secondary/20 focus:border-secondary input-transition font-body-lg text-body-lg placeholder-outline-variant/60" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Şifreyi göster" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-[0.98] transition-all mt-8" type="submit">
                    Giriş Yap
                </button>
</form>
